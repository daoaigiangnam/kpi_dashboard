name: PHP CI

on:
  push:
    branches:
      - feature/admin-foundation
  pull_request:
    branches:
      - feature/admin-foundation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, fileinfo, gd, iconv, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prepare testing environment
        run: cp .env.example .env

      - name: Run automated tests
        run: php artisan test --display-warnings --display-deprecations --display-phpunit-deprecations
